<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>홈 — 우리사이</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .now { background: var(--green); color:#fff; padding: 18px; }
  .now .big { font-size: 24px; font-weight: 800; letter-spacing: -.6px; }
  .now .small { opacity: .85; font-size: 13px; margin-top: 2px; }
  .locbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--indigo-pale);
    font-size: 12.5px; color: var(--indigo);
  }
  .locbar button {
    margin-left: auto; border: none; background: var(--indigo); color: #fff;
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .locbar.on { background: var(--green-pale); color: var(--green-dark); }
  .locbar.on button { background: var(--green); }
  .dist { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .dist b { color: var(--green); }

  /* 경로 안내 시트 */
  .sheet-bg { position: fixed; inset: 0; background: rgba(31,36,48,.45); z-index: 50; display: none; }
  .sheet-bg.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 460px; margin: 0 auto;
    background: #fff; border-radius: 18px 18px 0 0; z-index: 51;
    max-height: 78vh; overflow: auto; transform: translateY(100%);
    transition: transform .22s ease-out;
  }
  .sheet.show { transform: translateY(0); }
  .sheet .head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line-soft); }
  .sheet .head h3 { margin: 0 0 4px; font-size: 18px; }
  .sheet .sum {
    display: flex; gap: 16px; padding: 14px 18px;
    background: var(--bg-soft); font-size: 13px;
  }
  .sheet .sum b { display: block; font-size: 20px; color: var(--green); letter-spacing: -.4px; }
  .steps { padding: 6px 18px 22px; }
  .step { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .step .n {
    width: 22px; height: 22px; border-radius: 50%; background: var(--green-tint);
    color: var(--green); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .step .t { font-size: 13.5px; color: var(--text-2); }
  .step .m { font-size: 11.5px; color: var(--gray-2); margin-top: 2px; }
</style>
</head>
<body>
<div class="phone">
  <div id="top"></div>

  <div class="now">
    <div class="big" id="freeText">시간 계산 중…</div>
    <div class="small" id="freeSub">등록된 시간표 기준</div>
    <div class="small" id="freeBasis" style="opacity:.72;font-size:12px"></div>
  </div>

  <div class="locbar" id="locbar">
    <span id="locText">위치를 켜면 지금 있는 곳에서 걸리는 시간을 알려드려요</span>
    <button onclick="askLocation()" id="locBtn">위치 켜기</button>
  </div>

  <div class="page">
    <h2 style="font-size:17px">지금 갈 수 있는 곳</h2>

    <div class="pill-row" id="filters"></div>
    <div id="list"><div class="empty">불러오는 중…</div></div>
  </div>

  <div id="tabs"></div>
</div>


<script src="/static/js/common.js?v=41"></script>
<script>
document.getElementById("top").innerHTML = topbar("우리사이", false);
document.getElementById("tabs").innerHTML = tabbar("home");

const CATS = ["전체",
  "식사","가볍게",                        // 식사=한·중·일·양, 가볍게=카페·분식·술·치킨
  "편의점","의료","가정",                 // 의료=약국·병원, 가정=통신·세탁·안경
  "학원","실무","레저",                   // 실무=서점·스터디·문구·인쇄, 레저=오락·스포츠
  "미용실","화장품","의류","꽃집","사진",  // 뷰티
  "부동산","숙박","반려동물"];
let stores = [], active = "전체", myPos = null;

document.getElementById("filters").innerHTML = CATS.map(
  c => `<div class="pill ${c === "전체" ? "on" : ""}" onclick="setCat('${c}')">${c}</div>`
).join("");

function setCat(c) {
  active = c;
  document.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p.textContent === c));
  load();
}

// ---------- GPS (브라우저 내장, 별도 API 발급 불필요) ----------
function askLocation() {
  if (!navigator.geolocation) {
    document.getElementById("locText").textContent = "이 브라우저는 위치 기능을 지원하지 않아요";
    return;
  }
  document.getElementById("locBtn").textContent = "확인 중…";
  navigator.geolocation.getCurrentPosition(
    p => {
      myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      MY_POS = myPos;                       // 공용 경로 함수도 같은 위치 사용
      const bar = document.getElementById("locbar");
      bar.classList.add("on");
      document.getElementById("locText").textContent = "현재 위치 기준으로 계산합니다";
      document.getElementById("locBtn").textContent = "다시 확인";
      load();
    },
    err => {
      document.getElementById("locBtn").textContent = "위치 켜기";
      document.getElementById("locText").textContent =
        err.code === 1 ? "위치 권한이 거부돼 학교 정문 기준으로 보여드려요"
                       : "위치를 못 찾아 학교 정문 기준으로 보여드려요";
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
  );
}

// ---------- 목록 ----------
async function load() {
  const cat = active === "전체" ? "" : `&category=${encodeURIComponent(active)}`;
  document.getElementById("list").innerHTML = `<div class="empty">계산 중…</div>`;

  stores = myPos
    ? await api(`/api/nearby?lat=${myPos.lat}&lng=${myPos.lng}${cat}&limit=25`)
    : (await api("/api/stores")).filter(s => active === "전체" || s.category === active)
        .sort((a, b) => a.walk_min - b.walk_min).slice(0, 25);
  draw();
}

function draw() {
  if (!stores.length) {
    document.getElementById("list").innerHTML = `<div class="empty">해당 업종이 없습니다</div>`;
    return;
  }
  document.getElementById("list").innerHTML = stores.map(s => `
    <div class="card">
      <div class="card-row">
        <div class="grow">
          <h3>${s.name}</h3>
          <div class="meta">${s.category_detail || s.category}</div>
          <div class="dist">
            <b>도보 ${s.walk_min}분</b>${s.walk_meters ? ` · ${s.walk_meters}m` : ""}
            ${s.walk_source === "valhalla-realtime" ? " · 현재 위치 기준" : ""}
          </div>
        </div>
        <span class="badge ${badgeClass(s.congestion_label)}">${s.congestion_label}</span>
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn sm ghost" style="flex:1" onclick="openRoute('${s.id}')">가는 길 보기</button>
        <button class="btn sm ghost" style="flex:1" onclick="location.href='/store.html?id=${s.id}'">가게 정보</button>
      </div>
    </div>`).join("");
}

// 경로 안내(openRoute/closeRoute)는 common.js?v=41 공용 함수 사용.
// 홈에서 이미 켜둔 위치를 공용 MY_POS 로 넘겨준다.

// ---------- 초기화 ----------
(async () => {
  // 공강 배너는 서버가 계산한 값을 그대로 쓴다.
  // 브라우저 시계로 따로 계산하면 챗봇 답변과 어긋나고, 수업 중인 경우도 못 다룬다.
  try {
    const f = await api(`/api/free-now?user_id=${USER}`);
    document.getElementById("freeText").textContent = f.text;
    document.getElementById("freeSub").textContent = f.sub;
    // 근거를 같이 띄운다 — 숫자가 안 바뀌면 시간표가 안 바뀐 건지 바로 보인다
    document.getElementById("freeBasis").textContent = f.basis || "";
  } catch (e) {
    document.getElementById("freeText").textContent = "시간표를 등록해 주세요";
    document.getElementById("freeSub").textContent = "등록하면 공강에 맞춰 추천해드려요";
  }

  load();
})();
</script>
</body>
</html>
