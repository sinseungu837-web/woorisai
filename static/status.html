<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모델 상태 — 우리사이</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .phone { max-width: 860px; padding-bottom: 40px; }
  .mode {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-radius: var(--radius); margin-bottom: 16px; color: #fff;
  }
  .mode.real { background: var(--green); }
  .mode.stub { background: var(--indigo); }
  .mode b { font-size: 17px; }
  .mode .sub { opacity: .88; font-size: 12.5px; margin-top: 2px; }

  .model { border: 1px solid var(--line-soft); border-radius: var(--radius);
           padding: 16px; margin-bottom: 12px; }
  .model .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .model .hd b { font-size: 16px; }
  .model .id { font-size: 11.5px; color: var(--gray-2); font-family: ui-monospace, monospace; }
  .model .role { font-size: 13px; color: var(--gray); margin: 6px 0 12px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr)); gap: 8px; }
  .metric { background: var(--bg-soft); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
  .metric b { display: block; font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums; }
  .metric span { font-size: 11px; color: var(--gray); }
  .err { background: #FDE8E8; color: #9B2C2C; padding: 9px 12px; border-radius: var(--radius-sm);
         font-size: 12px; margin-top: 10px; word-break: break-all; }

  .gpu { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
         gap: 8px; margin-bottom: 18px; }
  .gpu div { background: #fff; border: 1px solid var(--line-soft);
             border-radius: var(--radius-sm); padding: 12px; text-align: center; }
  .gpu b { display: block; font-size: 18px; color: var(--green); font-variant-numeric: tabular-nums; }
  .gpu span { font-size: 11px; color: var(--gray); }

  .bt { border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px; }
  .bt .verdict { padding: 14px; border-radius: var(--radius-sm); margin-bottom: 12px; }
  .bt .verdict.pass { background: var(--green-pale); color: var(--green-dark); }
  .bt .verdict.fail { background: #FDE8E8; color: #9B2C2C; }
  .bt .verdict b { font-size: 16px; display: block; margin-bottom: 3px; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cmp th, table.cmp td { padding: 8px; border-bottom: 1px solid var(--line-soft); text-align: right; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp td { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="phone">
  <div id="top"></div>
  <div class="page">
    <h2>모델 상태</h2>
    <p class="sub">지금 어떤 모델이 어떻게 돌고 있는지 실시간으로 확인합니다</p>

    <div id="mode"></div>
    <div id="gpu"></div>
    <div id="models"></div>

    <h2 style="font-size:17px;margin-top:26px">예측 성능 검증</h2>
    <p class="sub" style="margin-bottom:12px">
      마지막 4분기를 가려놓고 예측해, 베이스라인(최근 4분기 평균)과 비교합니다
    </p>
    <button class="btn indigo" onclick="runBacktest()">백테스트 실행</button>
    <div id="bt" style="margin-top:14px"></div>
  </div>
</div>

<script src="/static/js/common.js?v=41"></script>
<script>
document.getElementById("top").innerHTML = topbar("모델 상태");

const won = n => (n / 1e8).toFixed(1) + "억";

async function load() {
  const s = await api("/api/system");
  const real = s.mode === "real";

  document.getElementById("mode").innerHTML = `
    <div class="mode ${real ? "real" : "stub"}">
      <div>
        <b>${real ? "실제 모델 구동 중" : "규칙 기반 모드"}</b>
        <div class="sub">${real
          ? "사전학습 가중치를 그대로 사용합니다 (추가 학습 없음)"
          : "GPU 없이 화면만 확인하는 모드입니다 · " + s.hint}</div>
      </div>
    </div>`;

  document.getElementById("gpu").innerHTML = s.gpu.available ? `
    <div class="gpu">
      <div><b>${s.gpu.name.replace("NVIDIA ", "")}</b><span>GPU</span></div>
      <div><b>${s.gpu.total_gb}GB</b><span>전체 메모리</span></div>
      <div><b>${s.gpu.allocated_gb}GB</b><span>모델 점유</span></div>
      <div><b>${(s.gpu.total_gb - s.gpu.reserved_gb).toFixed(1)}GB</b><span>여유</span></div>
    </div>` : "";

  document.getElementById("models").innerHTML = Object.entries(s.models).map(([k, m]) => `
    <div class="model">
      <div class="hd">
        <b>${k}</b>
        <span class="badge ${m.loaded ? "normal" : "quiet"}">
          ${m.loaded ? "로드됨 · " + (m.device || "").toUpperCase() : "규칙 기반"}
        </span>
      </div>
      <div class="id">${m.id}</div>
      <div class="role">${m.role}</div>
      <div class="metrics">
        <div class="metric"><b>${m.calls}</b><span>호출 횟수</span></div>
        <div class="metric"><b>${m.last_ms ?? "–"}</b><span>최근 (ms)</span></div>
        <div class="metric"><b>${m.avg_ms ?? "–"}</b><span>평균 (ms)</span></div>
      </div>
      ${m.error ? `<div class="err">${m.error}</div>` : ""}
    </div>`).join("");
}

async function runBacktest() {
  document.getElementById("bt").innerHTML = `<div class="empty">검증 중…</div>`;
  const b = await api("/api/backtest");
  if (!b.available) {
    document.getElementById("bt").innerHTML = `<div class="notice">${b.reason}</div>`;
    return;
  }
  document.getElementById("bt").innerHTML = `
    <div class="bt">
      <div class="verdict ${b.passed ? "pass" : "fail"}">
        <b>${b.passed ? "목표 달성" : "목표 미달"} · 개선율 ${b.improvement_pct}%</b>
        기준: 베이스라인 대비 MAE ${b.target_pct}% 이상 개선
      </div>
      <table class="cmp">
        <tr><th>구분</th><th>MAE</th><th>비고</th></tr>
        <tr><td>베이스라인</td><td>${won(b.baseline_mae)}</td><td>최근 4분기 평균</td></tr>
        <tr><td><b>모델</b></td><td><b>${won(b.model_mae)}</b></td><td>${b.method}</td></tr>
      </table>
      <p class="hint" style="margin-top:12px">
        가려둔 ${b.holdout}개 분기 실측: ${b.actual.map(won).join(" · ")}<br>
        모델 예측: ${b.model_pred.map(won).join(" · ")}
      </p>
    </div>`;
}

load();
setInterval(load, 5000);   // 5초마다 갱신
</script>
</body>
</html>
