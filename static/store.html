<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>가게 상세 — 우리사이</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="phone">
  <div id="top"></div>
  <div class="page" id="body"><div class="empty">불러오는 중…</div></div>
  <div id="tabs"></div>
</div>

<script src="/static/js/common.js?v=41"></script>
<script>
document.getElementById("top").innerHTML = topbar("가게 상세");
document.getElementById("tabs").innerHTML = tabbar("home");

const id = new URLSearchParams(location.search).get("id");

(async () => {
  const s = await api(`/api/stores/${id}`);
  const reviews = await api(`/api/reviews?store_id=${id}`);

  document.getElementById("body").innerHTML = `
    <div class="card-row" style="margin-bottom:14px">
      <div class="grow">
        <h2 style="margin:0">${s.name}</h2>
        <div class="meta">${s.category} · 도보 ${s.walk_min}분</div>
      </div>
      <span class="badge ${badgeClass(s.congestion_label)}">${s.congestion_label}</span>
    </div>

    <div class="card">
      <p style="margin:0 0 12px;font-size:14px;color:var(--text-2)">${s.description || ""}</p>
      <div class="meta">영업시간 ${s.hours || "-"}</div>
      ${s.capacity ? `<div class="meta">수용인원 최대 ${s.capacity}명</div>` : ""}
      ${s.price_from ? `<div class="meta">${s.price_from.toLocaleString()}원~</div>` : ""}
      <div class="meta">평균 체류 ${s.dwell_min}분 · 왕복 포함 ${s.walk_min * 2 + s.dwell_min}분 필요</div>
    </div>

    <div class="btn-row" style="margin-bottom:16px">
      ${s.navermap
        ? `<a class="btn" style="text-align:center;text-decoration:none" href="${s.navermap}">네이버지도로 길찾기</a>`
        : `<button class="btn ghost" onclick="alert('좌표가 아직 등록되지 않았습니다')">길찾기</button>`}
    </div>

    <h2 style="font-size:16px">익명 후기 ${reviews.length}건</h2>
    ${reviews.length
      ? reviews.map(r => `<div class="card"><p style="margin:0;font-size:14px">${r.text}</p></div>`).join("")
      : `<div class="empty">아직 후기가 없어요</div>`}

    <div class="field" style="margin-top:6px">
      <label>한 줄 후기 남기기</label>
      <input id="rv" placeholder="어땠어요? 한 줄이면 돼요">
    </div>
    <button class="btn ghost" onclick="submit()">익명으로 보내기</button>
    <p class="hint" style="text-align:center">별점·사진 없이 대화하듯 남기면 됩니다</p>`;
})();

async function submit() {
  const text = document.getElementById("rv").value.trim();
  if (!text) return;
  await post("/api/reviews", { store_id: id, text });
  location.reload();
}
</script>
</body>
</html>
